title: "[Q&A]: "
body:
  - type: markdown
    attributes:
      value: |
        Ask a question or seek help from the community regarding ReYogaSMC configuration.
  - type: input
    id: laptop-model
    attributes:
      label: Laptop Model
      placeholder: e.g. ThinkPad X1 Carbon Gen 7
    validations:
      required: true
  - type: input
    id: macos-opencore
    attributes:
      label: macOS & OpenCore Version
      placeholder: e.g. macOS Sonoma 14.5 / OpenCore 1.0.0
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What is your question or issue?
      description: Describe what you are trying to configure or what behavior you are seeing.
    validations:
      required: true
