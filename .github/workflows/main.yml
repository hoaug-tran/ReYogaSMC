name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  support-tool:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check profile matching and export recovery
        run: python -m unittest discover -s Tests -p "test_*.py"
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bootstrap locked dependencies
        run: bash Scripts/bootstrap.sh
      - name: Check support adapters
        run: |
          mkdir -p build
          cp -R HardwareProfiles build/HardwareProfiles
          swiftc YogaSMCNC/HardwareSupport.swift YogaSMCUtils/OSDHelper.swift Tests/main.swift -o build/SupportTests
          build/SupportTests
      - name: Build Debug and Release
        run: |
          xcodebuild -project ReYogaSMC.xcodeproj -target BuildAll -configuration Debug CODE_SIGNING_ALLOWED=NO
          xcodebuild -project ReYogaSMC.xcodeproj -target BuildAll -configuration Release CODE_SIGNING_ALLOWED=NO
      - name: Package development builds
        run: |
          bash Scripts/package.sh Debug
          bash Scripts/package.sh Release
      - uses: actions/upload-artifact@v4
        with:
          name: ReYogaSMC-development
          path: build/packages/**/*.zip
          if-no-files-found: error
