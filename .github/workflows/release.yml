name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bootstrap locked dependencies
        run: bash Scripts/bootstrap.sh
      - name: Check support tool
        run: python3 -m unittest discover -s Tests -p "test_*.py"
      - name: Build packages
        run: |
          xcodebuild -project ReYogaSMC.xcodeproj -target BuildAll -configuration Debug CODE_SIGNING_ALLOWED=NO
          xcodebuild -project ReYogaSMC.xcodeproj -target BuildAll -configuration Release CODE_SIGNING_ALLOWED=NO
          bash Scripts/package.sh Debug
          bash Scripts/package.sh Release
      - uses: actions/upload-artifact@v4
        with:
          name: ReYogaSMC-packages
          path: build/packages/**/*.zip
          if-no-files-found: error
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > build/release-notes.md <<'NOTES'
          ReYogaSMC driver, companion app and hardware support tool.

          These CI packages are unsigned development builds. Review compatibility and hardware validation before installing. App signing and notarization require the distributor's identity.
          NOTES
          gh release create "$RELEASE_TAG" build/packages/Debug/*.zip build/packages/Release/*.zip --draft --verify-tag --title "$RELEASE_TAG" --notes-file build/release-notes.md
